name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check

  browser-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        three-version: ['0.167.0', 'latest']
    name: Browser / Three.js ${{ matrix.three-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Three.js ${{ matrix.three-version }}
        run: npm install --force --no-save --package-lock=false three@${{ matrix.three-version }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test geometry
        run: npm run test:unit

      - name: Test packed consumer
        run: npm run test:consumer
        env:
          LUSTRE_THREE_VERSION: ${{ matrix.three-version }}

      - name: Test browser integration
        run: npm run test:browser
