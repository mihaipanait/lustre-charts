# Publish lustre-charts to npm when a version tag is pushed. After a version
# PR is merged, tag that main commit and push the tag:
#   git tag -a v0.2.0 -m v0.2.0 && git push origin v0.2.0
#
# Uses npm "trusted publishing" (OIDC) — no npm token is stored in this
# repo. One-time setup on npmjs.com (after the package's first manual
# publish): package → Settings → Trusted Publisher → GitHub Actions,
#   organization/user: mihaipanait
#   repository:        lustre-charts
#   workflow filename: release.yml
name: Release to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: write # Create or update the matching GitHub Release.
  id-token: write # OIDC token that npm exchanges for publish credentials

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm >= 11.5.1; keep the CLI current.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run quality gate
        run: npm run check

      - name: Test browser integration
        run: npm run test:browser

      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Publish
        run: |
          PACKAGE="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "$PACKAGE@$VERSION is already published; skipping npm publish."
          else
            npm publish
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/release-notes.mjs > release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
